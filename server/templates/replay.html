<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Replay - Match #{{ match_id }}</title>
    <link rel="icon" type="image/svg+xml" href="/visualizer/favicon.svg">
    <script src="/visualizer/js/visualizer-v2.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; background: #0d0d0d; color: #ccc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overflow: hidden; height: 100dvh; }
        header { background: #161616; border-bottom: 1px solid #222; padding: 0.8rem 2rem; display: flex; align-items: center; justify-content: space-between; position: fixed; top: 0; left: 0; right: 0; z-index: 20; height: 48px; }
        header a { color: #666; text-decoration: none; font-size: 0.85rem; }
        header a:hover { color: #aaa; }
        header .match-label { color: #fff; font-size: 0.9rem; font-weight: 600; }
        header .logo { color: #fff; font-weight: 700; font-size: 1rem; text-decoration: none; }
        header .logo span { color: #4caf50; }
        #viewer { width: 100%; height: calc(100dvh - 48px); position: relative; outline: none; top: 48px; }
        .av-controls {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: rgba(22,22,22,0.95); border-top: 1px solid #333;
            display: flex; flex-direction: column; gap: 0;
            z-index: 10;
        }
        .av-toolbar {
            display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 6px 16px;
        }
        .av-toolbar-left { display: flex; align-items: center; gap: 6px; }
        .av-toolbar-center { display: flex; align-items: center; gap: 6px; justify-self: center; }
        .av-toolbar-right { display: flex; align-items: center; gap: 2px; justify-self: end; }
        .av-spacer { flex: 1; }
        .av-btn {
            background: #2a2a2a; border: 1px solid #444; color: #ddd;
            border-radius: 4px; padding: 4px 10px; cursor: pointer; font-size: 13px;
        }
        .av-btn:hover { background: #3a3a3a; }
        .av-play { min-width: 36px; text-align: center; }
        .av-graph-bar { width: 100%; height: 88px; cursor: pointer; display: block; }
        .av-turn { font-size: 12px; color: #888; min-width: 80px; text-align: center; font-variant-numeric: tabular-nums; }
        .av-speed { font-variant-numeric: tabular-nums; min-width: 36px; text-align: center; }
        .av-fog-select { background: #2a2a2a; border: 1px solid #444; color: #ddd; border-radius: 4px; padding: 4px 6px; font-size: 12px; cursor: pointer; }
        .av-speed-select { background: #2a2a2a; border: 1px solid #444; color: #ddd; border-radius: 4px; padding: 4px 6px; font-size: 12px; cursor: pointer; }
        .av-error { color: #e57373; text-align: center; padding: 3rem; font-size: 1.1rem; }
        .av-mobile-overlay { display: none; }
        @media (max-width: 600px) {
            header { padding: 0.5rem 0.8rem; height: 40px; }
            #viewer { height: calc(100dvh - 40px); top: 40px; }
            .av-graph-bar { height: 44px; }
            .av-toolbar { display: flex; justify-content: center; padding: 6px 8px; gap: 6px; }
            .av-toolbar-left, .av-toolbar-right { display: none; }
            .av-toolbar-center { display: flex; gap: 4px; }
            .av-btn { padding: 8px 12px; font-size: 15px; min-height: 36px; min-width: 36px; display: flex; align-items: center; justify-content: center; }
            .av-play { min-width: 40px; min-height: 36px; }
            .av-loop-btn { display: none; }
            .av-mobile-overlay {
                display: flex; justify-content: space-between; position: absolute; left: 0; right: 0;
                padding: 6px 10px; z-index: 9; pointer-events: none;
                bottom: 0; margin-bottom: 92px; /* just above graph+toolbar */
            }
            .av-mobile-overlay select {
                pointer-events: auto;
                background: rgba(30,30,30,0.85); border: 1px solid #444; color: #ddd;
                border-radius: 6px; padding: 8px 12px; font-size: 14px; min-height: 38px;
            }
        }
    </style>
</head>
<body>
    <header>
        <a href="javascript:history.back()">← Back</a>
        <span class="match-label">Match #{{ match_id }}</span>
        <a href="/" class="logo">🐜 <span>AI Ants</span></a>
    </header>
    <div id="viewer"></div>
    <script>
        const viewer = document.getElementById('viewer');
        const vis = new AntsVisualizer.Visualizer(viewer);
        fetch('/replay_data/{{ match_id }}')
            .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
            .then(data => vis.load(data))
            .catch(e => {
                viewer.innerHTML = '<p class="av-error">Failed to load replay data</p>';
            });
    </script>
</body>
</html>
